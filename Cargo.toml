[package]
name = "dipak_site"
version = "0.1.0"
edition = "2024"

[dependencies]
askama = "0.16.0"
axum = { version = "0.8.9" , features = ["multipart"]}
tokio = { version = "1.52.2", features = ["full"] }
futures = "0.3.32"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"

tower = "0.5.3"
tower-http = { version = "0.6.9", features = ["fs", "cors"] }
axum_csrf = "0.11.0"

chrono = { version = "0.4.44", features = ["serde"] }
gemini-rust = "1.7.1"

# tracing
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "json"] }
tracing-appender = {version = "0.2.5"}

# observability removed

diesel = { version = "2.3.9", default-features = false, features = ["postgres", "chrono", "serde_json"] }
diesel_migrations = { version = "2.3.2", features = ["postgres"] }
diesel-async = { version = "0.9.0", features = ["postgres", "deadpool"] }
dotenvy = "0.15.7"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
regex = "1.12.3"

argon2 = "0.5.3"
aes-gcm = "0.10"
base64 = "0.22"
sha2 = "0.10"
uuid = { version = "1.23.1", features = ["v4"] }
cookie = "0.18.1"
lazy_static = "1.5.0"
utoipa = { version = "5.5.0", features = ["axum_extras", "chrono"] }
utoipa-swagger-ui = { version = "9.0.2", features = ["axum"] }


[profile.dev.package.askama_derive]
opt-level = 3


[profile.release]
opt-level = 3  # Max optimizations for performance
lto = true       # Enable Link Time Optimization
debug = false    # No debug symbols
panic = "abort"  # Abort on panic to reduce size
codegen-units = 1  # Improve cross-crate optimizations
strip = "debuginfo"  # Strip debug symbols
incremental = false  # Disable incremental compilation
overflow-checks = true
