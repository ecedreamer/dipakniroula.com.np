[package]
name = "dipak_site"
version = "0.1.0"
edition = "2024"

[dependencies]
askama = "0.16.0"
axum = { version = "0.8.9" , features = ["multipart"]}
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "fs", "net", "io-util"] }
tikv-jemallocator = "0.6.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"

tower-http = { version = "0.7.0", features = ["fs", "cors", "decompression-gzip", "decompression-br"] }
axum_csrf = "0.11.0"

chrono = { version = "0.4.45", features = ["serde"] }
gemini-rust = "2.0.0"

# tracing
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "json"] }
tracing-appender = {version = "0.2.5"}

# observability removed

diesel = { version = "2.3.12", default-features = false, features = ["postgres", "chrono", "serde_json"] }
diesel_migrations = { version = "2.3.2", features = ["postgres"] }
diesel-async = { version = "0.9.2", features = ["postgres", "deadpool"] }
dotenvy = "0.15.7"
reqwest = { version = "0.13.4", default-features = false, features = ["json", "form"] }
regex = "1.13.1"

argon2 = "0.5.3"
base64 = "0.23.1"
uuid = { version = "1.24.0", features = ["v4"] }
cookie = "0.18.1"
utoipa = { version = "5.5.0", features = ["axum_extras", "chrono"] }
utoipa-swagger-ui = { version = "9.0.2", features = ["axum"] }


[profile.dev.package.askama_derive]
opt-level = 3


[profile.release]
opt-level = 3  # Max optimizations for performance
lto = true       # Enable Link Time Optimization
debug = false    # No debug symbols
panic = "abort"  # Abort on panic to reduce size
codegen-units = 1  # Improve cross-crate optimizations
strip = "debuginfo"  # Strip debug symbols
incremental = false  # Disable incremental compilation
overflow-checks = true

[profile.release.build-override]
opt-level = 3
