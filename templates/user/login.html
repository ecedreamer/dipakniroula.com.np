{% extends "base.html" %}
{% block title %}Sign In — Dipak Niroula{% endblock %}

{% block content %}
<div class="section">
<div class="row justify-content-center">
    <div class="col-lg-5">
        <div class="contact-card p-4 p-md-5 text-center">
            <div class="mb-4">
                <p class="hero-eyebrow mb-2">Authentication</p>
                <h2 class="fw-bold">Sign In</h2>
                <p class="text-muted small">Sign in with Google to play quizzes</p>
            </div>

            <a href="{{ google_auth_url }}" class="btn-hero-primary w-100 justify-content-center mb-3">
                <i class="bi bi-google"></i> Sign in with Google
            </a>

            <p class="text-muted small mt-3 mb-0">
                <i class="bi bi-shield-check me-1"></i>
                Only your email and name are accessed. No admin access.
            </p>
        </div>
    </div>
</div>
</div>
{% endblock %}
